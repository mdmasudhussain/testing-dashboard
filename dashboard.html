<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForbeNext Mail | Secure Inbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            display: flex;
            height: 100vh;
            background: radial-gradient(circle at top left, #111f36 0%, #060d1b 42%, #040812 100%);
            color: #d7deef;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, rgba(23, 13, 53, 0.96), rgba(5, 14, 33, 0.96));
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 24px rgba(0, 0, 0, 0.35);
            z-index: 2;
        }
        .brand {
            padding: 24px 20px;
            font-size: 1.35rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.4px;
            color: #f3f0ff;
        }
        .compose-btn {
            margin: 20px;
            padding: 12px;
            background: linear-gradient(90deg, #5a49ff, #9627f5);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            box-shadow: 0 10px 20px rgba(108, 73, 255, 0.25);
        }
        .compose-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
        .nav-item {
            padding: 14px 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: 0.2s;
            font-size: 0.95rem;
            color: #a8b4cf;
        }
        .nav-item:hover { background: rgba(255, 255, 255, 0.05); color: #e4edff; }
        .nav-item.active {
            background: rgba(105, 78, 255, 0.18);
            border-left: 4px solid #7a6dff;
            font-weight: 600;
            color: #f1f4ff;
        }

        .main-panel { flex: 1; display: flex; flex-direction: column; background: transparent; }

        .header {
            height: 70px;
            border-bottom: 1px solid rgba(120, 138, 178, 0.18);
            background: rgba(7, 15, 30, 0.65);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }
        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(22, 36, 66, 0.85);
            border: 1px solid rgba(117, 138, 179, 0.34);
            padding: 8px 14px;
            border-radius: 10px;
            width: 420px;
        }
        .search-bar input { border: none; background: transparent; outline: none; margin-left: 10px; width: 100%; color: #dce6ff; }
        .search-bar input::placeholder { color: #90a2ca; }
        .user-profile { display: flex; align-items: center; gap: 14px; }
        .user-email-display { font-weight: 600; font-size: 0.9rem; color: #d8e0f1; }
        .logout-btn {
            padding: 8px 15px;
            background: #b23b53;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: 0.2s;
        }
        .logout-btn:hover { background: #9c3248; }

        .inbox-container { padding: 30px; flex: 1; overflow-y: auto; }
        .page-title { margin-bottom: 20px; color: #f2f5ff; font-size: 1.35rem; }

        .email-list { display: flex; flex-direction: column; gap: 10px; }
        .email-item {
            background: rgba(16, 27, 48, 0.9);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(93, 116, 156, 0.36);
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .email-item:hover { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); border-color: #7589b3; transform: translateY(-1px); }
        .email-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(145deg, #4f42fb, #ad24ff);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            margin-right: 15px;
        }
        .email-sender { width: 220px; font-weight: 600; font-size: 0.95rem; color: #eff3ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .email-subject { flex: 1; font-size: 0.95rem; color: #b8c5df; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .email-date { width: 100px; text-align: right; font-size: 0.85rem; color: #8fa0c1; }

        .system-alert {
            background: rgba(25, 49, 89, 0.78);
            border-left: 4px solid #5b8cff;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #cddcff;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .compose-overlay {
            position: fixed;
            inset: 0;
            background: rgba(1, 6, 15, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
        }
        .compose-overlay.open { opacity: 1; visibility: visible; }

        .compose-modal {
            width: min(860px, 100%);
            background: #1b2638;
            border-radius: 16px;
            border: 1px solid rgba(92, 113, 152, 0.58);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.46);
            overflow: hidden;
        }
        .compose-header {
            padding: 18px 22px;
            background: linear-gradient(90deg, #4e53f8 0%, #9f23f2 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }
        .compose-title { display: flex; align-items: center; gap: 12px; font-size: 2rem; font-weight: 700; }
        .compose-title .icon-badge {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .close-btn {
            border: none;
            background: transparent;
            color: #f4f0ff;
            font-size: 1.65rem;
            cursor: pointer;
            line-height: 1;
            opacity: 0.9;
        }
        .close-btn:hover { opacity: 1; }

        .compose-body { padding: 22px; }
        .field-label {
            display: block;
            margin-bottom: 8px;
            margin-top: 6px;
            color: #d6deef;
            font-weight: 600;
        }
        .compose-input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #485c82;
            border-radius: 12px;
            background: #142038;
            color: #f2f6ff;
            font-size: 1.02rem;
            margin-bottom: 14px;
            outline: none;
        }
        .compose-input::placeholder,
        .message-editor::placeholder { color: #8ea0c5; }
        .compose-input:focus,
        .message-editor:focus { border-color: #7f86ff; box-shadow: 0 0 0 2px rgba(127, 134, 255, 0.2); }

        .editor-shell {
            border: 1px solid #485c82;
            border-radius: 12px;
            overflow: hidden;
            background: #142038;
        }
        .toolbar {
            border-bottom: 1px solid #3b4d70;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
        }
        .tool-btn {
            border: none;
            background: transparent;
            color: #c2cee7;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            min-width: 30px;
        }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.07); color: #ffffff; }

        .message-editor {
            width: 100%;
            min-height: 220px;
            resize: vertical;
            border: none;
            padding: 14px;
            background: #142038;
            color: #eef2ff;
            outline: none;
            font-size: 1rem;
            line-height: 1.5;
        }

        .compose-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 22px;
        }
        .btn {
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-cancel {
            background: #42506a;
            color: #e7eefc;
        }
        .btn-send {
            background: linear-gradient(90deg, #4d4eff 0%, #9629f5 100%);
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 980px) {
            .sidebar { width: 220px; }
            .search-bar { width: 320px; }
            .email-sender { width: 160px; }
        }

        @media (max-width: 760px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; }
            .main-panel { min-height: 0; }
            .header { padding: 0 15px; }
            .search-bar { width: 180px; }
            .compose-footer { flex-direction: column-reverse; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">
            <i class="fas fa-layer-group" style="margin-right: 8px; color: #8f79ff;"></i> ForbeNext
        </div>
        <button class="compose-btn" id="openComposeBtn"><i class="fas fa-pen"></i> New Message</button>
        <div class="nav-item active"><i class="fas fa-inbox"></i> Inbox</div>
        <div class="nav-item"><i class="fas fa-paper-plane"></i> Sent</div>
        <div class="nav-item"><i class="fas fa-file-alt"></i> Drafts</div>
        <div class="nav-item"><i class="fas fa-trash"></i> Trash</div>
        <div style="margin-top: auto; padding: 20px; font-size: 0.75rem; color: rgba(212,225,255,0.45); text-align: center;">
            ForbeNext Secure Systems<br>v2.1.0
        </div>
    </div>

    <div class="main-panel">
        <div class="header">
            <div class="search-bar">
                <i class="fas fa-search" style="color: #9db0d6;"></i>
                <input type="text" placeholder="Search in mail...">
            </div>
            <div class="user-profile">
                <i class="fas fa-shield-alt" style="color: #8f79ff; font-size: 1.2rem;"></i>
                <span class="user-email-display" id="userEmailDisplay">loading...</span>
                <button class="logout-btn" onclick="logoutSession()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="inbox-container">
            <h2 class="page-title">Primary Inbox</h2>

            <div class="system-alert">
                <i class="fas fa-lock"></i>
                End-to-end encrypted email workspace. Open the new compose dashboard to draft your next message.
            </div>

            <div class="email-list" id="emailListContainer">
                <div style="text-align: center; padding: 50px; color: #9cb0d9;">
                    <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; margin-bottom: 15px; color: #7767ff;"></i>
                    <p>Decrypting secure vault...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="compose-overlay" id="composeOverlay" aria-hidden="true">
        <section class="compose-modal" role="dialog" aria-modal="true" aria-labelledby="composeTitle">
            <div class="compose-header">
                <h3 class="compose-title" id="composeTitle">
                    <span class="icon-badge"><i class="fas fa-pen-to-square"></i></span>
                    New Message
                </h3>
                <button class="close-btn" id="closeComposeBtn" aria-label="Close compose">×</button>
            </div>
            <div class="compose-body">
                <label class="field-label" for="toField">To</label>
                <input class="compose-input" type="email" id="toField" placeholder="recipient@example.com">

                <label class="field-label" for="subjectField">Subject</label>
                <input class="compose-input" type="text" id="subjectField" placeholder="Email subject">

                <label class="field-label" for="messageField">Message</label>
                <div class="editor-shell">
                    <div class="toolbar" aria-hidden="true">
                        <button class="tool-btn"><i class="fas fa-bold"></i></button>
                        <button class="tool-btn"><i class="fas fa-italic"></i></button>
                        <button class="tool-btn"><i class="fas fa-underline"></i></button>
                        <button class="tool-btn"><i class="fas fa-list"></i></button>
                        <button class="tool-btn"><strong>H1</strong></button>
                        <button class="tool-btn"><strong>H2</strong></button>
                        <button class="tool-btn"><strong>H3</strong></button>
                        <button class="tool-btn"><i class="fas fa-align-left"></i></button>
                        <button class="tool-btn"><i class="fas fa-align-center"></i></button>
                        <button class="tool-btn"><i class="fas fa-align-right"></i></button>
                        <button class="tool-btn"><i class="fas fa-link"></i></button>
                        <button class="tool-btn"><i class="fas fa-image"></i></button>
                        <button class="tool-btn"><i class="fas fa-code"></i></button>
                    </div>
                    <textarea class="message-editor" id="messageField" placeholder="Write your secure message..."></textarea>
                </div>

                <div class="compose-footer">
                    <button class="btn btn-cancel" id="cancelComposeBtn">Cancel</button>
                    <button class="btn btn-send" id="sendComposeBtn"><i class="fa-regular fa-paper-plane"></i> Send Message</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = localStorage.getItem('currentUser') || 'mdmasud';
            document.getElementById('userEmailDisplay').textContent = currentUser + '@forbenext.indevs.in';
            loadInbox(currentUser);
            setupComposeDashboard();
        });

        function logoutSession() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        function setupComposeDashboard() {
            const overlay = document.getElementById('composeOverlay');
            const openBtn = document.getElementById('openComposeBtn');
            const closeBtn = document.getElementById('closeComposeBtn');
            const cancelBtn = document.getElementById('cancelComposeBtn');
            const sendBtn = document.getElementById('sendComposeBtn');
            const toField = document.getElementById('toField');

            function openCompose() {
                overlay.classList.add('open');
                overlay.setAttribute('aria-hidden', 'false');
                toField.focus();
            }

            function closeCompose() {
                overlay.classList.remove('open');
                overlay.setAttribute('aria-hidden', 'true');
            }

            openBtn.addEventListener('click', openCompose);
            closeBtn.addEventListener('click', closeCompose);
            cancelBtn.addEventListener('click', closeCompose);

            overlay.addEventListener('click', function(event) {
                if (event.target === overlay) {
                    closeCompose();
                }
            });

            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && overlay.classList.contains('open')) {
                    closeCompose();
                }
            });

            sendBtn.addEventListener('click', function() {
                const recipient = document.getElementById('toField').value.trim();
                const subject = document.getElementById('subjectField').value.trim();
                const message = document.getElementById('messageField').value.trim();

                if (!recipient || !subject || !message) {
                    alert('Please fill in To, Subject, and Message before sending.');
                    return;
                }

                alert('Message queued for encrypted delivery.');
                closeCompose();
                document.getElementById('toField').value = '';
                document.getElementById('subjectField').value = '';
                document.getElementById('messageField').value = '';
            });
        }

        async function loadInbox(username) {
            const container = document.getElementById('emailListContainer');
            setTimeout(() => {
                const mockEmails = [
                    { sender: 'System Administrator', subject: 'Welcome to your new ForbeNext Enterprise Inbox', date: '10:45 AM' },
                    { sender: 'IT Department', subject: 'Action Required: Review Security Protocols', date: 'Yesterday' },
                    { sender: 'Cloudflare Alerts', subject: "D1 Database 'email_db' connected successfully", date: 'Mar 09' }
                ];
                renderEmails(mockEmails, container);
            }, 650);
        }

        function renderEmails(emailArray, container) {
            container.innerHTML = '';

            emailArray.forEach(email => {
                const initial = email.sender.charAt(0).toUpperCase();

                const mailHTML = `
                    <div class="email-item">
                        <div class="email-avatar">${initial}</div>
                        <div class="email-sender">${email.sender}</div>
                        <div class="email-subject">${email.subject}</div>
                        <div class="email-date">${email.date}</div>
                    </div>
                `;
                container.innerHTML += mailHTML;
            });
        }
    </script>
</body>
</html>
